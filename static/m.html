<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="岗位追踪">
<link rel="icon" href="data:,">
<title>岗位追踪 · 手机版</title>
<style>
  /* ===== 与电脑版同一套设计令牌（BMW 企业风）：改这里两边一起变 ===== */
  :root{
    --primary:#1c69d4; --primary-active:#0653b6; --primary-disabled:#d6d6d6;
    --ink:#262626; --body:#3c3c3c; --body-strong:#1a1a1a; --muted:#6b6b6b; --muted-soft:#9a9a9a;
    --hairline:#e6e8ec; --hairline-strong:#d5d8de;
    --canvas:#ffffff; --surface-soft:#f7f7f7; --surface-card:#fafafa; --surface-strong:#ebebeb;
    --surface-dark:#1a2129;
    --on-primary:#fff;
    --success:#22c55e; --warning:#f59e0b; --error:#dc2626;
    --ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","微软雅黑",
         "Helvetica Neue",Arial,Helvetica,sans-serif;

    /* 形状尺度：与电脑版完全一致，不另起一套 */
    --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;
    --ctl-h:40px; --ctl-h-sm:32px; --ctl-h-xs:28px;
    --ease:cubic-bezier(.22,1,.36,1); --dur:.16s;
    --ring:0 0 0 3px rgba(28,105,212,.15);
    --shadow-card:0 1px 2px rgba(16,24,40,.04),0 10px 26px -16px rgba(16,24,40,.16);
    --shadow-pop:0 12px 32px -12px rgba(16,24,40,.22),0 2px 6px rgba(16,24,40,.06);

    --tab:56px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--canvas);color:var(--body);font-family:var(--ff);
    font-size:15px;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;
    transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),
      color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
  button:focus-visible{outline:none;box-shadow:var(--ring)}
  a{color:inherit;text-decoration:none}
  input,textarea,select{font-family:inherit;color:var(--ink);font-size:15px}
  .hide{display:none!important}

  /* ---------- 顶栏（对应电脑版 .topnav：白底 + 1px hairline） ---------- */
  .top{
    position:sticky;top:0;z-index:30;background:var(--canvas);
    border-bottom:1px solid var(--hairline);
    padding:calc(10px + var(--safe-t)) 16px 12px;
  }
  .top-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .top-title{font-size:15px;font-weight:700;letter-spacing:.2px;color:var(--ink)}
  .top-meta{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  .iconbtn{width:var(--ctl-h-sm);height:var(--ctl-h-sm);display:grid;place-items:center;
    border:1px solid var(--hairline-strong);border-radius:var(--r-xs);color:var(--muted);font-size:15px}
  .iconbtn:active{background:var(--surface-soft)}

  /* 搜索框：和电脑版输入框同款（白底 + hairline-strong 边框 + 8px 圆角） */
  .field{display:flex;align-items:center;gap:8px;height:var(--ctl-h);padding:0 12px;
    border:1px solid var(--hairline-strong);border-radius:var(--r-sm);background:var(--canvas);
    transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
  .field:focus-within{border-color:var(--primary);box-shadow:var(--ring)}
  .field svg{flex:none;color:var(--muted-soft)}
  .field input{flex:1;min-width:0;border:0;background:none;outline:none}
  .field input::placeholder{color:#a8adb6}
  .field .clr{display:none;width:20px;height:20px;border-radius:50%;background:var(--surface-strong);
    color:var(--muted);font-size:11px;line-height:20px;text-align:center}
  .field.has .clr{display:block}

  /* 分段控制器：与电脑版 .seg 一致（浅底药丸 + 选中 #111） */
  .toprow2{display:flex;align-items:center;gap:8px;margin-top:10px}
  .seg{display:flex;gap:4px;background:#f4f4f5;padding:4px;border-radius:var(--r-full);overflow-x:auto;
    scrollbar-width:none;flex:1;min-width:0}
  .seg::-webkit-scrollbar{display:none}
  .seg button{border:none;background:transparent;border-radius:var(--r-full);height:30px;padding:0 14px;
    font-size:13px;font-weight:400;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
  .seg button.on{background:#111;color:#fff}
  .seg .n{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums}
  .btn-sm{height:var(--ctl-h-sm);padding:0 12px;font-size:13px;font-weight:700;letter-spacing:.2px;
    border:1px solid var(--hairline-strong);border-radius:var(--r-xs);background:var(--canvas);
    color:var(--ink);white-space:nowrap}
  .btn-sm:active{background:var(--surface-soft)}

  /* ---------- 主体 ---------- */
  main{padding:12px 16px calc(var(--tab) + var(--safe-b) + 16px)}
  .pull{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
    gap:8px;color:var(--muted);font-size:12px;transition:height var(--dur) var(--ease)}
  .spin{width:13px;height:13px;border:2px solid var(--hairline);border-top-color:var(--primary);
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 岗位卡片：白底 + 1px hairline + 12px 圆角 + 弱阴影（与电脑版 .card 同语言） */
  .jcard{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-md);
    padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-card);
    transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
  .jcard:active{transform:scale(.99)}
  .jc-top{display:flex;align-items:flex-start;gap:10px}
  .jc-name{font-size:16px;font-weight:700;line-height:1.35;color:var(--ink);flex:1;letter-spacing:.1px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* 薪资：电脑版是黑字加粗（.tag-sal），不是红字 */
  .jc-sal{font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;
    font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .jc-sal.unk{font-size:12px;font-weight:400;color:var(--muted-soft)}
  .jc-sub{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:13px;color:var(--muted)}
  .jc-sub .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-soft);flex:none}
  .jc-sub .co{color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .jc-foot{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;
    border-top:1px solid var(--hairline);font-size:12px;color:var(--muted-soft)}
  .jc-foot .score{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .jc-foot .score b{color:var(--ink);font-weight:700}

  /* 标签：直接沿用电脑版 .tag 及其状态色 */
  .tag{display:inline-block;padding:2px 8px;border:1px solid var(--hairline-strong);
    font-size:11px;line-height:1.6;color:var(--muted);white-space:nowrap;border-radius:var(--r-xs)}
  .tag-new{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;letter-spacing:.5px}
  .tag-off{border-color:var(--hairline);color:var(--muted-soft)}
  .tag-sal{border-color:var(--ink);color:var(--ink);font-weight:700}
  .tag-applied{border-color:var(--primary);color:var(--primary);font-weight:700}
  .tag-fail{border-color:var(--error);color:var(--error)}
  .tag-replied{background:#111;border-color:#111;color:#fff;font-weight:700}
  .tag-stage-itv{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  .tag-stage-offer{background:#d8f36b;border-color:#bcd94e;color:#1a2129;font-weight:700}
  .tag-stage-rej{border-color:var(--hairline);color:var(--muted-soft);text-decoration:line-through}

  /* 平台标识：配色与电脑版 PLAT_META 一致（BOSS 青绿 / 猎聘 橙） */
  .pfx{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;
    color:#fff;font-size:10.5px;font-weight:700;flex:none}
  .pfx.boss{background:#00BEBD}
  .pfx.lp{background:#FF6A00}
  .pfx.lg{width:20px;height:20px;font-size:12px;border-radius:5px}

  /* 骨架 */
  .sk{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-md);
    padding:16px;margin-bottom:10px}
  .sk i{display:block;background:linear-gradient(90deg,#eef0f3 25%,#f7f8fa 37%,#eef0f3 63%);
    background-size:400% 100%;animation:sh 1.1s linear infinite;border-radius:4px;height:12px;margin-bottom:9px}
  .sk i:last-child{margin-bottom:0}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:48px 20px;line-height:1.7}
  .empty b{display:block;color:var(--ink);font-size:15px;font-weight:700;margin-bottom:6px}

  /* ---------- 底部 Tab（沿用顶部导航的语言：选中=墨色 + 细指示条） ---------- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--canvas);
    border-top:1px solid var(--hairline);padding-bottom:var(--safe-b)}
  .tabbar button{flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;color:var(--muted-soft);font-size:11px;letter-spacing:.4px;position:relative}
  .tabbar button.on{color:var(--ink);font-weight:700}
  .tabbar button.on::before{content:"";position:absolute;top:-1px;width:26px;height:2px;background:var(--ink)}
  .tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .tabbar .badge{position:absolute;transform:translate(13px,-9px);min-width:16px;height:16px;padding:0 4px;
    border-radius:var(--r-full);background:var(--ink);color:#fff;font-size:10px;line-height:16px;
    text-align:center;display:none;font-weight:700}
  .tabbar .badge.show{display:block}

  /* ---------- 底部弹层 ---------- */
  .mask{position:fixed;inset:0;background:rgba(26,33,41,.42);z-index:50;opacity:0;pointer-events:none;
    transition:opacity var(--dur) var(--ease)}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--canvas);
    border-top:1px solid var(--hairline);border-radius:var(--r-lg) var(--r-lg) 0 0;
    box-shadow:var(--shadow-pop);transform:translateY(102%);
    transition:transform .28s var(--ease);max-height:92vh;display:flex;flex-direction:column;
    padding-bottom:var(--safe-b)}
  .sheet.on{transform:translateY(0)}
  .sh-grab{width:34px;height:4px;border-radius:2px;background:var(--surface-strong);margin:9px auto 2px;flex:none}
  .sh-head{display:flex;align-items:center;gap:8px;padding:10px 16px;flex:none;
    border-bottom:1px solid var(--hairline)}
  .sh-title{font-size:14px;font-weight:700;color:var(--ink);flex:1;min-width:0;letter-spacing:.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
  .sh-foot{flex:none;padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--hairline);
    display:flex;gap:8px;background:var(--canvas)}

  /* 按钮：与电脑版 .btn / .btn-primary 同尺寸语义（移动端加高到 44 便于点按） */
  .btn{height:44px;padding:0 20px;border-radius:var(--r-sm);display:flex;align-items:center;
    justify-content:center;gap:6px;font-size:14px;font-weight:700;letter-spacing:.4px;
    border:1px solid var(--hairline-strong);background:var(--canvas);color:var(--ink);flex:1}
  .btn:active{background:var(--surface-soft)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .btn.primary:active{background:var(--primary-active);border-color:var(--primary-active)}
  .btn.ghost{background:var(--surface-soft);border-color:var(--hairline)}
  .btn.sm{height:34px;padding:0 12px;font-size:13px;letter-spacing:.2px;border-radius:var(--r-xs);flex:none}
  .btn:disabled{background:var(--primary-disabled);border-color:var(--primary-disabled);color:var(--muted)}

  /* 详情 */
  .d-name{font-size:18px;font-weight:700;line-height:1.35;color:var(--ink);flex:1;letter-spacing:.1px}
  .d-sal{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .d-top{display:flex;align-items:flex-start;gap:10px}
  .d-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px}
  .kv{display:grid;grid-template-columns:78px 1fr;gap:9px 12px;font-size:13.5px;margin-top:16px;
    padding-top:14px;border-top:1px solid var(--hairline)}
  .kv .k{color:var(--muted);font-size:12px;font-weight:500}
  .kv .v{color:var(--body);min-width:0;word-break:break-word}
  .sect{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);
    margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--hairline)}
  .sect:first-child{margin-top:0}
  .jd{font-size:14px;line-height:1.75;color:var(--body);white-space:pre-wrap;word-break:break-word}
  .rowbtn{display:flex;gap:8px;flex-wrap:wrap}
  .rowbtn .btn{flex:1;min-width:88px}
  textarea.note{width:100%;min-height:76px;border:1px solid var(--hairline-strong);border-radius:var(--r-sm);
    padding:11px 12px;font-size:14px;line-height:1.6;resize:vertical;outline:none;background:var(--canvas)}
  textarea.note:focus{border-color:var(--primary);box-shadow:var(--ring)}
  textarea.note::placeholder{color:#a8adb6}

  /* 筛选 */
  .fgroup{margin-bottom:20px}
  .fgroup h4{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:10px}
  .fopts{display:flex;flex-wrap:wrap;gap:8px}
  .fopt{height:var(--ctl-h-sm);padding:0 14px;border-radius:var(--r-xs);border:1px solid var(--hairline-strong);
    background:var(--canvas);font-size:13px;color:var(--body);display:flex;align-items:center}
  .fopt.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}

  /* 看板 */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-md);
    padding:16px;box-shadow:var(--shadow-card)}
  .kpi .lb{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .kpi b{display:block;font-size:26px;font-weight:700;line-height:1.2;color:var(--ink);
    font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.2px}
  .kpi .dt{font-size:11.5px;color:var(--muted-soft);margin-top:2px}
  .bars{margin-top:14px}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
  .bar .nm{width:58px;color:var(--muted);flex:none;font-size:12.5px}
  .bar .tr{flex:1;height:6px;background:var(--surface-strong);border-radius:3px;overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:3px;background:var(--primary);
    transform-origin:left;transition:transform .5s var(--ease)}
  .bar .vl{width:34px;text-align:right;color:var(--body);font-variant-numeric:tabular-nums;font-size:12.5px}
  .hint{font-size:12px;color:var(--muted);line-height:1.7;padding:12px 0 0}

  /* 我的 */
  .list{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden}
  .li{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--hairline);
    font-size:14px;color:var(--ink)}
  .li:last-child{border-bottom:0}
  .li .r{margin-left:auto;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
  .li .r .ok{color:var(--success)} .li .r .no{color:var(--error)}
  .li:active{background:var(--surface-soft)}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--safe-b) + 26px);transform:translate(-50%,8px);
    background:var(--surface-dark);color:#fff;font-size:13px;padding:9px 16px;border-radius:var(--r-sm);
    z-index:80;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
    max-width:86vw;text-align:center;box-shadow:var(--shadow-pop)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .sk i{animation:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="top-title" id="pageTitle">岗位</div>
    <div class="top-meta" id="topMeta"></div>
    <button class="iconbtn" id="btnRefresh" aria-label="刷新">↻</button>
  </div>
  <div class="field" id="searchBox">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    <input id="q" type="search" placeholder="搜岗位 / 公司 / 关键词" autocomplete="off" enterkeyhint="search">
    <button class="clr" id="qClear" aria-label="清空">✕</button>
  </div>
  <div class="toprow2">
    <div class="seg" id="chips"></div>
    <button class="btn-sm" id="btnFilter">筛选</button>
  </div>
</header>

<main>
  <div class="pull" id="pull"><span class="spin"></span><span id="pullTxt">下拉刷新</span></div>

  <!-- 岗位 -->
  <section id="view-jobs">
    <div id="jobList"></div>
    <div id="jobSentinel" style="height:1px"></div>
  </section>

  <!-- 投递 -->
  <section id="view-apps" class="hide">
    <div class="seg" id="appChips" style="margin-bottom:12px"></div>
    <div id="appList"></div>
  </section>

  <!-- 看板 -->
  <section id="view-dash" class="hide">
    <div class="seg" id="dashChips" style="margin-bottom:12px"></div>
    <div class="kpis" id="kpis"></div>
    <div class="kpi" style="margin-top:10px;padding-bottom:6px">
      <div class="lb">转化漏斗</div>
      <div class="bars" id="funnel"></div>
    </div>
    <div class="kpi" style="margin-top:10px;padding-bottom:6px">
      <div class="lb">高薪岗位更看重的技能</div>
      <div class="bars" id="skills"></div>
    </div>
    <div class="hint" id="dashHint"></div>
  </section>

  <!-- 我的 -->
  <section id="view-me" class="hide">
    <div class="sect" style="margin-top:0">平台登录</div>
    <div class="list">
      <div class="li"><span>BOSS 直聘</span><span class="r" id="bossState">—</span></div>
      <div class="li"><span>猎聘</span><span class="r" id="lpState">—</span></div>
    </div>
    <div class="hint">登录要在 <b style="color:var(--ink)">电脑</b> 上扫码：点一下子会在这台电脑弹出浏览器窗口，手机端没法扫码。登录后手机这边自动显示「已登录」。</div>

    <div class="sect">数据</div>
    <div class="list">
      <div class="li"><span>岗位总数</span><span class="r" id="mTotal">—</span></div>
      <div class="li"><span>在招 / 已下线</span><span class="r" id="mActive">—</span></div>
      <div class="li"><span>已投递 / 已回复</span><span class="r" id="mApplied">—</span></div>
      <div class="li"><span>面试中 / Offer</span><span class="r" id="mStage">—</span></div>
    </div>

    <div class="sect">其他</div>
    <div class="list">
      <div class="li" onclick="location.href='/?desktop=1'"><span>切到电脑版</span><span class="r">›</span></div>
      <div class="li"><span>当前访问地址</span><span class="r" id="mHost">—</span></div>

<div class="toast" id="toast"></div>

<script>
/* ================= 基础工具 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer=null;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),1900);
}
async function jget(url){
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(r.status===401){ location.href='/__login'; throw new Error('需要口令'); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function jpost(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  if(r.status===401){ location.href='/__login'; throw new Error('需要口令'); }
  return r.json();
}
function platOf(j){
  const u=String((j&&j.job_url)||'');
  return (j&&j.source==='liepin')||/liepin\.com/i.test(u)?'liepin':'boss';
}
/* 与电脑版 PLAT_META 同色（BOSS 青绿 #00BEBD / 猎聘 橙 #FF6A00） */
function pfx(p,lg){
  return p==='liepin'
    ? `<span class="pfx lp${lg?' lg':''}" title="猎聘">猎</span>`
    : `<span class="pfx boss${lg?' lg':''}" title="BOSS直聘">B</span>`;
}
function locText(city,area){
  if(!city) return area||'';
  if(!area||area===city) return city;
  return area.startsWith(city)?area:city+'·'+area;
}
const STAGE={interview:['tag-stage-itv','面试中'],offer:['tag-stage-offer','Offer'],rejected:['tag-stage-rej','未通过']};
function stageTag(j){
  const s=STAGE[j.stage];
  return s?`<span class="tag ${s[0]}">${s[1]}</span>`:'';
}
function stateTags(j){
  const out=[];
  if(j.status==='offline') out.push('<span class="tag tag-off">已下线</span>');
  if(j.is_new) out.push('<span class="tag tag-new">新增</span>');
  const st=stageTag(j);
  if(st) out.push(st);
  else{
    if(j.replied===1) out.push('<span class="tag tag-replied">已回复</span>');
    if(j.applied===1) out.push('<span class="tag tag-applied">已投递</span>');
    else if(j.applied===2) out.push('<span class="tag tag-fail">投递失败</span>');
  }
  return out.join('');
}

/* ================= 状态 ================= */
const S={
  tab:'jobs',
  page:1,size:20,total:0,loading:false,done:false,
  q:'',source:'',sort:'salary_desc',flags:{},rows:[],bySource:{},
  appTab:'waiting', dashSource:'', counts:{}
};
const FLAG_KEYS=['is_new','starred','applied','replied','no_salary','offline'];

function query(){
  const p=new URLSearchParams();
  p.set('page',S.page); p.set('size',S.size);
  if(S.q) p.set('q',S.q);
  if(S.source) p.set('source',S.source);
  p.set('sort',S.sort);
  for(const k of FLAG_KEYS){
    if(!S.flags[k]) continue;
    if(k==='offline') p.set('status','offline');
    else p.set(k,'1');
  }
  return p.toString();
}

/* ================= 岗位列表 ================= */
function skeleton(n){
  let h='';
  for(let i=0;i<n;i++) h+=`<div class="sk"><i style="width:58%;height:15px"></i>
    <i style="width:34%"></i><i style="width:72%"></i></div>`;
  return h;
}
function cardHtml(j){
  const p=platOf(j);
  const sal=j.salary?`<div class="jc-sal">${esc(j.salary)}</div>`
    :`<div class="jc-sal unk">薪资未知</div>`;
  const tags=[];
  if(j.experience) tags.push(`<span class="tag">${esc(j.experience)}</span>`);
  if(j.degree) tags.push(`<span class="tag">${esc(j.degree)}</span>`);
  if(j.scale) tags.push(`<span class="tag">${esc(j.scale)}</span>`);
  const st=stateTags(j);
  return `<article class="jcard" data-id="${esc(j.job_id)}">
    <div class="jc-top">
      <div class="jc-name">${esc(j.job_name||'无标题')}</div>
      ${sal}
    </div>
    <div class="jc-sub">
      <span class="co">${esc(j.company||'')}</span>
      <i class="dot"></i><span>${esc(locText(j.city_name,j.area_district))}</span>
    </div>
    ${(tags.length||st)?`<div class="jc-tags">${st}${tags.join('')}</div>`:''}
    <div class="jc-foot">
      ${pfx(p)}
      ${j.applied_at?`<span>投 ${esc(String(j.applied_at).slice(5,10))}</span>`:''}
      ${(j.match_score!=null&&j.match_score>0)?`<span class="score">匹配 <b>${j.match_score}</b></span>`:''}
      <button class="star${j.starred?' on':''}" data-star="${esc(j.job_id)}" aria-label="收藏"
        style="margin-left:8px;font-size:15px;color:${j.starred?'#f5a623':'var(--hairline-strong)'}">★</button>
    </div>
  </article>`;
}
async function loadJobs(reset){
  if(S.loading) return;
  if(reset){ S.page=1; S.done=false; S.rows=[]; $('#jobList').innerHTML=skeleton(4); }
  if(S.done) return;
  S.loading=true;
  try{
    const d=await jget('/api/jobs?'+query());
    S.total=d.total||0; S.counts=d.counts||{};
    const rows=d.rows||[];
    if(reset) $('#jobList').innerHTML='';
    if(!rows.length && S.page===1){
      $('#jobList').innerHTML=`<div class="empty"><b>没有符合条件的岗位</b>换个关键词或放宽筛选看看</div>`;
    }else{
      $('#jobList').insertAdjacentHTML('beforeend',rows.map(cardHtml).join(''));
    }
    S.rows=S.rows.concat(rows);
    if(rows.length<S.size || S.rows.length>=S.total) S.done=true;
    S.page++;
    $('#topMeta').textContent=`${S.total} 条`;
    renderChips();
  }catch(e){
    if(reset) $('#jobList').innerHTML=
      `<div class="empty"><b>加载失败</b>${esc(e.message)}<div style="margin-top:14px">
        <button class="btn sm" onclick="loadJobs(true)" style="margin:0 auto">重试</button></div></div>`;
  }finally{ S.loading=false; }
}

new IntersectionObserver(es=>{
  if(es.some(e=>e.isIntersecting) && S.tab==='jobs' && !S.loading && !S.done) loadJobs(false);
},{rootMargin:'300px'}).observe($('#jobSentinel'));

$('#jobList').addEventListener('click',ev=>{
  const st=ev.target.closest('[data-star]');
  if(st){
    ev.stopPropagation();
    const id=st.dataset.star, on=st.classList.contains('on')?0:1;
    jpost('/api/star',{job_id:id,star:on}).then(r=>{
      if(r.ok){ st.classList.toggle('on',!!on); toast(on?'已收藏':'已取消收藏'); }
    });
    return;
  }
  const card=ev.target.closest('.jcard');
  if(card) openJob(card.dataset.id);
});

/* ================= 详情弹层 ================= */
let curJob=null;
function sheetOpen(id){ $(id).classList.add('on'); $('#mask').classList.add('on'); document.body.style.overflow='hidden'; }
function sheetClose(){
  $('#jobSheet').classList.remove('on'); $('#filterSheet').classList.remove('on');
  $('#mask').classList.remove('on'); document.body.style.overflow='';
}
$('#mask').addEventListener('click',sheetClose);
$('#dClose').addEventListener('click',sheetClose);

async function openJob(id){
  $('#dTitle').textContent='加载中…';
  $('#dBody').innerHTML=skeleton(3);
  $('#dFoot').innerHTML='';
  sheetOpen('#jobSheet');
  try{
    const d=await jget('/api/job?job_id='+encodeURIComponent(id));
    if(!d.ok) throw new Error(d.msg||'读取失败');
    curJob=d.job; renderJob(d.job);
  }catch(e){
    $('#dTitle').textContent='加载失败';
    $('#dBody').innerHTML=`<div class="empty"><b>岗位信息读取失败</b>${esc(e.message)}<div style="margin-top:14px">
      <button class="btn sm" onclick="openJob('${esc(id)}')" style="margin:0 auto">重试</button></div></div>`;
  }
}
function renderJob(j){
  const p=platOf(j);
  const isLp=p==='liepin';
  $('#dTitle').textContent=(j.company||'岗位详情')+(isLp?' · 猎聘':' · BOSS');
  const kv=[
    ['公司',esc(j.company||'—')+(j.gold_hunter===1?' <span class="tag">猎头</span>':'')+(String(j.company||'').startsWith('某')?' <span class="tag tag-off">保密</span>':'')],
    ['地点',esc(locText(j.city_name,j.area_district)||'—')],
    ['经验 / 学历',esc([j.experience,j.degree].filter(Boolean).join(' · ')||'—')],
    ['规模 / 行业',esc([j.scale,j.industry].filter(Boolean).join(' · ')||'—')],
  ];
  if(j.boss_name) kv.push(['HR',esc(j.boss_name)+(j.boss_title?'（'+esc(j.boss_title)+'）':'')]);
  kv.push(['首次看到',esc(String(j.first_seen||'').slice(0,10)||'—')]);
  const jd=j.detail_text?esc(j.detail_text.slice(0,4000))
    :(isLp?'<span style="color:var(--muted-soft)">猎聘详情页要登录猎聘才读得到，JD 常为空。点下方「在猎聘打开」自己看。</span>'
          :'<span style="color:var(--muted-soft)">暂无描述，电脑端点「补抓描述」可补全</span>');
  $('#dBody').innerHTML=`
    <div class="d-top">
      <div class="d-name">${esc(j.job_name||'')}</div>
      <div class="d-sal">${j.salary?esc(j.salary):'<span style="font-size:12px;font-weight:400;color:var(--muted-soft)">薪资未知</span>'}</div>
    </div>
    <div class="d-meta">${pfx(p,1)}<span style="font-size:12px;color:var(--muted)">${isLp?'猎聘':'BOSS直聘'}</span>${stateTags(j)}</div>
    <div class="kv">${kv.map(([k,v])=>`<div class="k">${k}</div><div class="v">${v}</div>`).join('')}</div>
    <div class="sect">职位描述</div>
    <div class="jd">${jd}</div>
    <div class="sect">我的备注</div>
    <textarea class="note" id="dNote" maxlength="500" placeholder="记点什么，比如：已投、等二面、HR 微信…">${esc(j.note||'')}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn sm" id="dSaveNote">保存备注</button>
      <button class="btn sm" id="dStar">${j.starred?'取消收藏':'收藏'}</button>
      <button class="btn sm" id="dReply">${j.replied===1?'取消已回复':'标记已回复'}</button>
    </div>
    <div class="sect">求职阶段</div>
    <div class="rowbtn">
      <button class="btn sm ${j.stage==='interview'?'primary':''}" data-stage="interview">面试中</button>
      <button class="btn sm ${j.stage==='offer'?'primary':''}" data-stage="offer">Offer</button>
      <button class="btn sm ${j.stage==='rejected'?'primary':''}" data-stage="rejected">未通过</button>
      ${j.stage?'<button class="btn sm ghost" data-stage="">清除</button>':''}
    </div>`;

  const foot=[];
  if(j.job_url) foot.push(`<a class="btn ghost" href="${esc(j.job_url)}" target="_blank" rel="noopener">${isLp?'在猎聘打开':'在 BOSS 打开'}</a>`);
  if(j.status!=='offline'){
    if(isLp) foot.push(`<button class="btn ghost" disabled>猎聘需官网投递</button>`);
    else if(j.applied===1) foot.push(`<button class="btn ghost" disabled>已投递</button>`);
    else foot.push(`<button class="btn primary" id="dApply">投递</button>`);
  }
  $('#dFoot').innerHTML=foot.join('');

  $('#dSaveNote').onclick=async()=>{
    const note=$('#dNote').value;
    const r=await jpost('/api/note',{job_id:j.job_id,note});
    toast(r.ok?'备注已保存':'保存失败');
    if(r.ok){ j.note=note; patchRow(j.job_id,{note}); }
  };
  $('#dStar').onclick=async()=>{
    const on=j.starred?0:1;
    const r=await jpost('/api/star',{job_id:j.job_id,star:on});
    if(r.ok){ j.starred=on; toast(on?'已收藏':'已取消收藏'); renderJob(j); patchRow(j.job_id,{starred:on}); }
  };
  $('#dReply').onclick=async()=>{
    const on=j.replied===1?0:1;
    const r=await jpost('/api/replies/mark',{job_id:j.job_id,replied:on});
    if(r.ok){ j.replied=on; toast(r.msg||'已更新'); renderJob(j); patchRow(j.job_id,{replied:on}); }
  };
  $('#dBody').querySelectorAll('[data-stage]').forEach(b=>{
    b.onclick=async()=>{
      const stage=b.dataset.stage;
      const r=await jpost('/api/stage',{job_id:j.job_id,stage,note:''});
      if(r.ok){ j.stage=stage; toast(r.msg||'已更新'); renderJob(j); patchRow(j.job_id,{stage}); }
      else toast(r.msg||'操作失败');
    };
  });
  const ap=$('#dApply');
  if(ap) ap.onclick=async()=>{
    if(!confirm('真的向 HR 发起打招呼？发出后无法撤回。\n（投递由电脑端执行，电脑需已登录 BOSS）')) return;
    ap.disabled=true; ap.textContent='投递中…';
    try{
      const r=await jpost('/api/apply',{job_ids:[j.job_id]});
      toast(r.msg||(r.ok?'已开始投递':'投递失败'));
      if(!r.ok){ ap.disabled=false; ap.textContent='投递'; }
    }catch(e){ ap.disabled=false; ap.textContent='投递'; toast('投递失败：'+e.message); }
  };
}
function patchRow(id,patch){
  const row=S.rows.find(x=>x.job_id===id);
  if(row) Object.assign(row,patch);
  const el=$(`#jobList .jcard[data-id="${CSS.escape(id)}"]`);
  if(el && row) el.outerHTML=cardHtml(row);
}

/* ================= 投递页 ================= */
const APP_TABS=[['waiting','等待回复'],['replied','已回复'],['all','全部']];
function renderAppChips(){
  $('#appChips').innerHTML=APP_TABS.map(([k,l])=>
    `<button class="${S.appTab===k?'on':''}" data-app="${k}">${l}</button>`).join('');
}
$('#appChips').addEventListener('click',e=>{
  const b=e.target.closest('[data-app]'); if(!b) return;
  S.appTab=b.dataset.app; renderAppChips(); loadApps();
});
async function loadApps(){
  const box=$('#appList'); box.innerHTML=skeleton(4);
  try{
    const d=await jget('/api/replies?limit=200');
    let rows=(d.rows||[]);
    if(S.appTab==='waiting') rows=rows.filter(r=>r.replied!==1);
    if(S.appTab==='replied') rows=rows.filter(r=>r.replied===1);
    $('#topMeta').textContent=`投 ${d.applied||0} · 回 ${d.total||0}`;
    if(!rows.length){ box.innerHTML=`<div class="empty"><b>${S.appTab==='waiting'?'没有等待回复的岗位':'这里还没有记录'}</b>
      投递后的岗位会出现在这里，不用等 HR 回复</div>`; return; }
    box.innerHTML=rows.map(r=>{
      const p=platOf(r), waiting=r.replied!==1;
      return `<article class="jcard" data-id="${esc(r.job_id)}">
        <div class="jc-top"><div class="jc-name">${esc(r.job_name||'')}</div>
          <div class="jc-sal">${r.salary?esc(r.salary):''}</div></div>
        <div class="jc-sub"><span class="co">${esc(r.company||'')}</span><i class="dot"></i>
          <span>${esc(locText(r.city_name,r.area_district))}</span></div>
        <div class="jc-tags">${waiting?'<span class="tag">等待回复</span>':'<span class="tag tag-replied">已回复</span>'}${stageTag(r)}
          ${r.replied_at?`<span class="tag">回 ${esc(String(r.replied_at).slice(5,10))}</span>`:''}</div>
        <div class="jc-foot">${pfx(p)}
          ${r.applied_at?`<span>投 ${esc(String(r.applied_at).slice(5,10))}</span>`:''}</div>
      </article>`;
    }).join('');
  }catch(e){
    box.innerHTML=`<div class="empty"><b>加载失败</b>${esc(e.message)}</div>`;
  }
}
$('#appList').addEventListener('click',e=>{
  const c=e.target.closest('.jcard'); if(c) openJob(c.dataset.id);
});

/* ================= 看板 ================= */
function renderDashChips(){
  $('#dashChips').innerHTML=[['','全部'],['boss','BOSS'],['liepin','猎聘']].map(([k,l])=>
    `<button class="${S.dashSource===k?'on':''}" data-ds="${k}">${l}</button>`).join('');
}
$('#dashChips').addEventListener('click',e=>{
  const b=e.target.closest('[data-ds]'); if(!b) return;
  S.dashSource=b.dataset.ds; renderDashChips(); loadDash();
});
async function loadDash(){
  $('#kpis').innerHTML=`<div class="kpi"><div class="lb">加载中</div><b>…</b></div>`;
  try{
    const [st,gap]=await Promise.all([
      jget('/api/stats?days=14&source='+encodeURIComponent(S.dashSource)),
      jget('/api/skills/salary?source='+encodeURIComponent(S.dashSource)+'&min_jobs=3').catch(()=>({rows:[]}))
    ]);
    const kpis=[
      ['在招岗位',st.active,'总入库 '+(st.total||0)],
      ['已投递',st.applied,'投递率 '+(st.apply_rate||0)+'%'],
      ['近 7 天新增',st.new_7d,(st.new_delta==null?'—':(st.new_delta>0?'↑':'↓')+Math.abs(st.new_delta)+'% vs 上周')],
      ['平均月薪',(st.avg_salary?st.avg_salary+'K':'—'),'有薪资的岗位']
    ];
    $('#kpis').innerHTML=kpis.map(([l,v,d])=>
      `<div class="kpi"><div class="lb">${l}</div><b>${v==null?'—':esc(String(v))}</b><div class="dt">${esc(d)}</div></div>`).join('');
    const fun=[['在招',st.active],['已投',st.applied],['已回复',st.replied||0],['面试',st.interview||0],['Offer',st.offer||0]];
    const mx=Math.max(1,...fun.map(x=>x[1]));
    $('#funnel').innerHTML=fun.map(([n,v])=>
      `<div class="bar"><span class="nm">${n}</span><span class="tr"><i style="transform:scaleX(${(v/mx).toFixed(3)})"></i></span><span class="vl">${v}</span></div>`).join('');
    const rows=(gap.rows||[]).filter(x=>x.premium>0).slice(0,6);
    $('#skills').innerHTML=rows.length?rows.map(x=>
      `<div class="bar"><span class="nm" style="width:76px">${esc(x.skill)}</span>
        <span class="tr"><i style="transform:scaleX(${Math.min(1,(x.premium||0)/6).toFixed(2)})"></i></span>
        <span class="vl">+${x.premium}K</span></div>`).join('')
      :'<div class="hint">数据还不够（至少 3 个岗位提到同一技能）</div>';
    $('#dashHint').textContent='高薪线 = 全体在招薪资 P75；溢价 = 要求该技能的岗位薪资中位数 − 不要求的。样本少的技能波动大，别只看一条。';
  }catch(e){
    $('#kpis').innerHTML=`<div class="kpi"><div class="lb">加载失败</div><b>—</b><div class="dt">${esc(e.message)}</div></div>`;
  }
}

/* ================= 我的 ================= */
async function loadMe(){
  try{
    const [b,l,c,t]=await Promise.all([
      jget('/api/login_state?platform=boss'),
      jget('/api/login_state?platform=liepin'),
      jget('/api/counts'),
      jget('/api/tunnel')
    ]);
    $('#bossState').innerHTML=b.logged?'<span class="ok">● 已登录</span>':'<span class="no">● 未登录</span>';
    $('#lpState').innerHTML=l.logged?'<span class="ok">● 已登录</span>':'<span class="no">● 未登录</span>';
    $('#mTotal').textContent=c.total+' 条';
    $('#mActive').textContent=(c.active||0)+' / '+(c.offline||0);
    $('#mApplied').textContent=(c.applied||0)+' / '+(c.replied||0);
    $('#mStage').textContent=(c.interview||0)+' / '+(c.offer||0);
    $('#mHost').textContent=location.host;
    const mt=$('#mTunnel');
    if(mt)mt.innerHTML=t.online
      ? '<span class="ok">● 已开启'+(t.fixed?'·固定':'')+'</span>'
      : '<span class="no">● 未开启</span>';
  }catch(e){
    $('#bossState').textContent='读取失败';
  }
}

/* ================= 标签切换 ================= */
function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['jobs','apps','dash','me'].forEach(v=>$('#view-'+v).classList.toggle('hide',v!==tab));
  $('#pageTitle').textContent={jobs:'岗位',apps:'投递',dash:'看板',me:'我的'}[tab];
  $('#searchBox').classList.toggle('hide',tab!=='jobs');
  document.querySelector('.toprow2').classList.toggle('hide',tab!=='jobs');
  $('#topMeta').textContent='';
  if(tab==='jobs'&&!S.rows.length) loadJobs(true);
  if(tab==='apps'){ renderAppChips(); loadApps(); }
  if(tab==='dash'){ renderDashChips(); loadDash(); }
  if(tab==='me') loadMe();
  window.scrollTo({top:0,behavior:'instant'});
}
document.querySelectorAll('.tabbar button').forEach(b=>{
  b.onclick=()=>switchTab(b.dataset.tab);
});

/* ================= 平台筛选（分段控制器，与电脑版 .seg 一致） ================= */
function renderChips(){
  const c=S.counts||{}, bs=S.bySource||{};
  const total=c.total!=null?c.total:S.total;
  $('#chips').innerHTML=[
    ['','全部',total],
    ['boss','BOSS',bs.boss!=null?bs.boss:null],
    ['liepin','猎聘',bs.liepin!=null?bs.liepin:null]
  ].map(([k,l,n])=>
    `<button class="${S.source===k?'on':''}" data-src="${k}">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`
  ).join('');
  $('#btnFilter').textContent=flagCount()?`筛选 · ${flagCount()}`:'筛选';
}
function flagCount(){ return FLAG_KEYS.filter(k=>S.flags[k]).length; }
$('#chips').addEventListener('click',e=>{
  const b=e.target.closest('[data-src]'); if(!b) return;
  S.source=b.dataset.src; renderChips(); loadJobs(true);
});
$('#btnFilter').onclick=()=>{ syncFilterUI(); sheetOpen('#filterSheet'); };

/* ================= 筛选面板 ================= */
function syncFilterUI(){
  document.querySelectorAll('#sortOpts .fopt').forEach(b=>b.classList.toggle('on',b.dataset.v===S.sort));
  document.querySelectorAll('#flagOpts .fopt').forEach(b=>b.classList.toggle('on',!!S.flags[b.dataset.k]));
}
$('#sortOpts').addEventListener('click',e=>{
  const b=e.target.closest('[data-v]'); if(!b) return;
  S.sort=b.dataset.v; syncFilterUI();
});
$('#flagOpts').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]'); if(!b) return;
  const k=b.dataset.k; S.flags[k]=!S.flags[k]; syncFilterUI();
});
$('#fReset').onclick=()=>{ S.sort='salary_desc'; S.flags={}; syncFilterUI(); };
$('#fApply').onclick=()=>{ sheetClose(); renderChips(); loadJobs(true); };

/* ================= 搜索 ================= */
let qTimer=null;
$('#q').addEventListener('input',e=>{
  const v=e.target.value.trim();
  $('#searchBox').classList.toggle('has',!!v);
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{ S.q=v; loadJobs(true); },350);
});
$('#qClear').onclick=()=>{ $('#q').value=''; $('#searchBox').classList.remove('has'); S.q=''; loadJobs(true); };

/* ================= 下拉刷新 ================= */
let pullStart=null,pulling=false;
const mainEl=document.querySelector('main');
mainEl.addEventListener('touchstart',e=>{
  if(window.scrollY<=0 && !pulling){ pullStart=e.touches[0].clientY; }
},{passive:true});
mainEl.addEventListener('touchmove',e=>{
  if(pullStart==null) return;
  const dy=e.touches[0].clientY-pullStart;
  if(dy>0 && window.scrollY<=0){
    pulling=true;
    const h=Math.min(52,dy*0.5);
    $('#pull').style.height=h+'px';
    $('#pullTxt').textContent=h>=42?'松开刷新':'下拉刷新';
  }
},{passive:true});
mainEl.addEventListener('touchend',()=>{
  if(!pulling){ pullStart=null; return; }
  const h=parseInt($('#pull').style.height||'0',10);
  $('#pull').style.height='0px';
  if(h>=42){ $('#pullTxt').textContent='刷新中…'; refreshAll(); }
  pulling=false; pullStart=null;
},{passive:true});

/* ================= 刷新 / 初始化 ================= */
async function refreshAll(){
  await Promise.all([loadJobs(true),loadMe()]);
  toast('已刷新');
}
$('#btnRefresh').onclick=refreshAll;

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && S.tab==='me') loadMe();
});

(async function boot(){
  $('#buildStamp').textContent='__BUILD__';
  try{
    const st=await jget('/api/stats?days=30');
    S.bySource=st.by_source||{};
    renderChips();
  }catch(e){}
  await loadJobs(true);
  loadMe();
  try{
    const d=await jget('/api/replies?limit=1');
    const n=(d.applied||0)-(d.total||0);
    if(n>0){ const b=$('#tabBadge'); b.textContent=n>99?'99+':n; b.classList.add('show'); }
  }catch(e){}
})();
</script>
